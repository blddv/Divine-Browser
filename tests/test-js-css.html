<!doctype html><html><head><title>QuickJS and CSS test</title><style>body { background-color: #eeeeff; color: #004400; } .hide {display:none} #out { color: #bb0000; font-size: 24px; font-weight: bold; } </style></head><body><h1>QuickJS CSS 2.1</h1><p class="hide">HIDDEN BY CSS</p><div id="out">BEFORE SCRIPT</div><noscript>NO JAVASCRIPT</noscript><button id="btn">Click me</button><script>document.getElementById('out').textContent='SCRIPT EXECUTED'; document.getElementById('btn').addEventListener('click',function(){document.getElementById('out').textContent='CLICK WORKED';});</script></body></html>
